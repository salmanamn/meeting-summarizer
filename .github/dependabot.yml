# GitHub Actions versions, weekly, grouped into one PR. Python packages are moved by hand (`uv lock
# --upgrade-package`, then `uv export` into src/requirements.txt), with the tests and the package gate (D34).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
