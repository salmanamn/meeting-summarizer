# The queue trigger (D55): KEDA owns the replica count (no replicas field, or every apply would reset it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meeting.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      {{- include "meeting.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meeting.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # A job in flight is redelivered after its visibility timeout and resumes from its record (D18)
      terminationGracePeriodSeconds: 60
      {{- include "meeting.functionsPod" (dict "root" . "functions" .Values.functions.worker "resources" .Values.worker.resources "ready" "/admin/host/ping" "models" .Values.models.enabled) | nindent 6 }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meeting.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ .Release.Name }}-worker
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers:
    # The approximate count includes messages in flight, so the worker stays up while a job runs.
    - type: azure-queue
      metadata:
        queueName: {{ .Values.keda.queue.name }}
        queueLength: "1"
        activationQueueLength: "0"
      authenticationRef:
        kind: ClusterTriggerAuthentication
        name: {{ .Values.keda.queue.clusterTriggerAuthentication }}