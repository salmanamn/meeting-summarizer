[project]
name = "meeting-summarizer"
version = "0.1.0"
description = "Meeting summarizer: a recording in Blob storage -> transcript -> decisions, action items and open questions as strict JSON -> Cosmos DB"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14,<3",
    "openai>=3.57,<4",
    "httpx>=0.28,<1", # the Speech batch transcription client (D45); openai depends on it too, now named
]

# One group per job (D10). The Functions app ships `stt`, `storage`, `function` and `docs` (M3); `fixtures` (Piper,
# GPL) only makes the synthetic test meetings on the laptop and never ships; `models` only fetches model files.
# Locally `uv sync` installs every group below.
[dependency-groups]
stt = [
    "faster-whisper==1.2.1",
    "av>=18,<19", # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which PyAV 19 removed (Project 4 D2)
]
storage = [
    "azure-storage-blob>=12.31,<13",
    "azure-cosmos>=4.17,<5",
    "azure-identity>=1.27,<2", # identity-based connections on Azure (no keys); unused with the emulators' keys
]
function = [
    "azure-functions>=2.4,<3",
]
docs = [
    "docling-slim[format-docx]==2.151.1", # DOCX -> Markdown, simple pipeline, no models (D22)
    "pypdfium2>=5.15,<6", # the PDF text layer (D22); Docling's PDF pipeline needs a layout model on PyTorch
]
fixtures = [
    "piper-tts==1.8.0",
    "reportlab>=4.4,<5", # the test meetings' PDF attachments (BSD); their DOCX ones use python-docx from `docs`
]
models = [
    "huggingface-hub>=1.0,<2",
    "httpx>=0.28,<1", # resumable model downloads (src/meeting/download.py, from Project 4)
    "defusedxml>=0.7,<0.8", # the AMI annotations (scripts/ami_set.py) are untrusted XML
]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]
lab = [
    "azure-storage-queue>=12.18,<13",
]

[tool.uv]
default-groups = ["stt", "storage", "function", "docs", "fixtures", "models", "lab", "dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"] # function_app.py and the scripts' helpers are importable by the tests
addopts = "-ra -m 'not integration'" # `-m integration` on the command line runs the emulator tests instead
markers = ["integration: needs the compose lab (Azurite, Cosmos emulator) up"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/decisions_index.py" = ["RUF001"] # the en dash in "D1–D11" is intended (file copied from Project 4)
